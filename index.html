function DangerDetailPage({ id, go, openDanger }) {
  const { lang, t } = useLang();
  const DANGERS = useMemo(() => getDangers(lang), [lang]);
  const total = DANGERS.length;
  const index = DANGERS.findIndex((d) => d.id === id);
  const d = DANGERS[index];
  const detailContentRef = useRef(null);
  if (!d) return null;
  const Icon = d.icon;

  // Полный текст темы целиком — для общей кнопки «Прослушать всё»
  // у заголовка, точно так же, как «Прослушать» у заголовка главы книги.
  const fullSpeechText = withPause(
    d.title,
    [
      d.explanation,
      `${t.sectionSigns}. ` + d.signs.join(". "),
      `${t.sectionTodo}. ` + d.todo.join(". "),
      `${t.sectionAvoid}. ` + d.avoid.join(". "),
      `${t.sectionRule}. ` + d.rule,
    ].join(" ")
  );

  // Выбор темы: список слева (на desktop) или лента сверху (на мобильном)
  // никогда не пропадает — меняется только содержимое, без перезагрузки
  // страницы. На мобильном дополнительно прокручиваем к началу содержимого
  // темы, чтобы новый текст сразу попал в поле зрения — так же, как в книге.
  const selectDanger = (newId) => {
    openDanger(newId);
    if (typeof window !== "undefined" && window.matchMedia("(max-width: 767px)").matches) {
      requestAnimationFrame(() => {
        detailContentRef.current?.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }
  };

  return (
    <div className="mx-auto max-w-6xl px-4 py-8 sm:px-8 sm:py-10">
      <button
        onClick={() => go("dangers")}
        className="mb-6 flex min-h-11 items-center gap-2 text-lg font-semibold text-blue-700 hover:text-blue-900"
      >
        <ArrowLeft className="h-5 w-5 shrink-0" />
        {t.dangerDetailBackAll}
      </button>

      <h1 className="text-2xl font-extrabold text-blue-900 sm:text-4xl">{t.dangersListTitle}</h1>

      {/* Прогресс — так же, как в книге «Смартфон с нуля» */}
      <div className="mt-5">
        <div className="flex items-center justify-between text-base font-semibold text-blue-800">
          <span>{t.topicOf(index + 1, total)}</span>
          <span>{Math.round(((index + 1) / total) * 100)}%</span>
        </div>
        <div className="mt-2 h-3 w-full overflow-hidden rounded-full bg-blue-100">
          <div
            className="h-full rounded-full bg-blue-600 transition-all"
            style={{ width: `${((index + 1) / total) * 100}%` }}
          />
        </div>
      </div>

      <div className="mt-7 flex flex-col gap-6 md:flex-row md:items-start md:gap-7">
        {/* Мобильная лента выбора темы — всегда видна, ничего не сворачивается */}
        <nav className="md:hidden" aria-label={t.navAriaMobileTopics}>
          <div className="-mx-1 flex gap-2 overflow-x-auto px-1 pb-1">
            {DANGERS.map((dd, i) => {
              const DIcon = dd.icon;
              const active = dd.id === d.id;
              return (
                <button
                  key={dd.id}
                  onClick={() => selectDanger(dd.id)}
                  aria-current={active ? "true" : undefined}
                  className={
                    "flex min-h-11 shrink-0 items-center gap-2 whitespace-nowrap rounded-2xl px-3.5 py-2.5 text-sm font-semibold transition " +
                    (active
                      ? "bg-blue-700 text-white shadow-sm"
                      : "border border-blue-100 bg-white text-blue-900")
                  }
                >
                  <span
                    className={
                      "flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-xs font-bold " +
                      (active ? "bg-white/20 text-white" : "bg-blue-100 text-blue-700")
                    }
                  >
                    {i + 1}
                  </span>
                  <DIcon className="h-4 w-4 shrink-0" />
                  {dd.title}
                </button>
              );
            })}
          </div>
        </nav>

        {/* Desktop-колонка: постоянный список всех тем слева */}
        <nav className="hidden shrink-0 md:block md:w-72" aria-label={t.navAriaDesktopTopics}>
          <ol className="sticky top-24 space-y-1 rounded-3xl border border-blue-100 bg-white p-3 shadow-sm">
            {DANGERS.map((dd, i) => {
              const DIcon = dd.icon;
              const active = dd.id === d.id;
              return (
                <li key={dd.id}>
                  <button
                    onClick={() => selectDanger(dd.id)}
                    aria-current={active ? "true" : undefined}
                    className={
                      "flex w-full items-center gap-3 rounded-2xl px-3 py-2.5 text-left text-base font-semibold transition " +
                      (active
                        ? "bg-blue-700 text-white shadow-sm"
                        : "text-blue-900 hover:bg-blue-50")
                    }
                  >
                    <span
                      className={
                        "flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-xs font-bold " +
                        (active ? "bg-white/20 text-white" : "bg-blue-100 text-blue-700")
                      }
                    >
                      {i + 1}
                    </span>
                    <DIcon className="h-5 w-5 shrink-0" />
                    <span className="leading-snug">{dd.title}</span>
                  </button>
                </li>
              );
            })}
          </ol>
        </nav>

        {/* Контент выбранной темы — занимает всё оставшееся пространство */}
        <div ref={detailContentRef} className="min-w-0 flex-1">
          <div className="rounded-3xl border border-blue-100 bg-white p-5 shadow-sm sm:p-9">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div className="flex min-w-0 items-center gap-3 sm:gap-4">
                <div className="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-blue-100 sm:h-14 sm:w-14">
                  <Icon className="h-7 w-7 text-blue-700 sm:h-8 sm:w-8" />
                </div>
                <h2 className="text-xl font-bold text-blue-900 sm:text-3xl">
                  {t.topicHeading(index + 1, d.title)}
                </h2>
              </div>
              <SpeakButton id={`danger-full-${d.id}`} text={fullSpeechText} label={t.listenAll} />
            </div>

            <div className="mt-6">
              <div className="flex flex-wrap items-start justify-between gap-3">
                <h3 className="text-xl font-bold text-blue-900">{t.sectionWhat}</h3>
                <SpeakButton
                  id={`danger-explanation-${d.id}`}
                  text={withPause(t.sectionWhat, d.explanation)}
                />
              </div>
              <p className="mt-3 text-lg leading-relaxed text-slate-700">{d.explanation}</p>
            </div>

            <div className="mt-6 rounded-2xl border border-amber-200 bg-amber-50 p-5">
              <div className="flex flex-wrap items-start justify-between gap-3">
                <h3 className="text-lg font-bold text-amber-900">{t.sectionSigns}</h3>
                <SpeakButton
                  id={`danger-signs-${d.id}`}
                  text={withPause(t.sectionSigns, d.signs.join(". "))}
                />
              </div>
              <ul className="mt-3 space-y-2">
                {d.signs.map((s, i) => (
                  <li key={i} className="flex gap-3 text-base leading-relaxed text-slate-700">
                    <Info className="mt-1 h-5 w-5 shrink-0 text-amber-600" />
                    {s}
                  </li>
                ))}
              </ul>
            </div>

            <div className="mt-5 grid gap-5 sm:grid-cols-2">
              <div className="rounded-2xl border border-green-200 bg-green-50 p-5">
                <div className="flex flex-wrap items-start justify-between gap-3">
                  <h3 className="text-lg font-bold text-green-900">{t.sectionTodo}</h3>
                  <SpeakButton
                    id={`danger-todo-${d.id}`}
                    text={withPause(t.sectionTodo, d.todo.join(". "))}
                  />
                </div>
                <ul className="mt-3 space-y-2">
                  {d.todo.map((s, i) => (
                    <li key={i} className="flex gap-3 text-base leading-relaxed text-slate-700">
                      <CheckCircle2 className="mt-1 h-5 w-5 shrink-0 text-green-600" />
                      {s}
                    </li>
                  ))}
                </ul>
              </div>
              <div className="rounded-2xl border border-red-200 bg-red-50 p-5">
                <div className="flex flex-wrap items-start justify-between gap-3">
                  <h3 className="text-lg font-bold text-red-900">{t.sectionAvoid}</h3>
                  <SpeakButton
                    id={`danger-avoid-${d.id}`}
                    text={withPause(t.sectionAvoid, d.avoid.join(". "))}
                  />
                </div>
                <ul className="mt-3 space-y-2">
                  {d.avoid.map((s, i) => (
                    <li key={i} className="flex gap-3 text-base leading-relaxed text-slate-700">
                      <XCircle className="mt-1 h-5 w-5 shrink-0 text-red-600" />
                      {s}
                    </li>
                  ))}
                </ul>
              </div>
            </div>

            <div className="mt-6 flex flex-wrap items-start justify-between gap-3 rounded-2xl bg-blue-700 p-6 text-center sm:text-left">
              <div className="flex-1">
                <p className="text-sm font-semibold uppercase tracking-wide text-blue-200">
                  {t.sectionRule}
                </p>
                <p className="mt-2 text-xl font-bold leading-relaxed text-white">{d.rule}</p>
              </div>
              <SpeakButton
                id={`danger-rule-${d.id}`}
                text={withPause(t.sectionRule, d.rule)}
                tone="onDark"
              />
            </div>
          </div>

          {/* Навигация «Назад / Далее» — без зацикливания, с отключением
              на границах, так же, как в книге «Смартфон с нуля». */}
          <div className="mt-6 flex items-center justify-between gap-4">
            <button
              onClick={() => selectDanger(DANGERS[index - 1]?.id)}
              disabled={index === 0}
              className="flex items-center gap-2 rounded-2xl border-2 border-blue-200 bg-white px-5 py-4 text-lg font-bold text-blue-800 shadow-sm transition hover:bg-blue-50 disabled:cursor-not-allowed disabled:opacity-40"
            >
              <ChevronLeft className="h-5 w-5" />
              {t.back}
            </button>
            <button
              onClick={() => selectDanger(DANGERS[index + 1]?.id)}
              disabled={index === total - 1}
              className="flex items-center gap-2 rounded-2xl bg-blue-700 px-5 py-4 text-lg font-bold text-white shadow-sm transition hover:bg-blue-800 disabled:cursor-not-allowed disabled:opacity-40"
            >
              {t.next}
              <ChevronRight className="h-5 w-5" />
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  Страница: книга «Смартфон с нуля»                                     */
/* ---------------------------------------------------------------------- */

function BookPage({ go, chapter, setChapter, startOpened = false }) {
  const { lang, t } = useLang();
  const CHAPTERS = useMemo(() => getChapters(lang), [lang]);
  const total = CHAPTERS.length;
  const ch = CHAPTERS[chapter];
  const Icon = ch.icon;
  const chapterContentRef = useRef(null);

  // Два шага, как в разделе «Опасности»:
  //   1) сначала крупные карточки тем (как на карточках "Узнать об
  //      опасностях") — ничего не открыто;
  //   2) после нажатия на карточку открывается вид «список сбоку + текст
  //      рядом»: на мобильном — лента сверху, на десктопе — закреплённый
  //      список слева, содержимое главы — сразу СПРАВА от списка, а не
  //      где-то в самом низу страницы.
  const [opened, setOpened] = useState(!!startOpened);

  const selectChapter = (i) => {
    setChapter(i);
    setOpened(true);
    if (typeof window !== "undefined" && window.matchMedia("(max-width: 767px)").matches) {
      requestAnimationFrame(() => {
        chapterContentRef.current?.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }
  };

  return (
    <div className="mx-auto max-w-6xl px-4 py-8 sm:px-8 sm:py-10">
      <button
        onClick={() => (opened ? setOpened(false) : go("home"))}
        className="mb-6 flex min-h-11 items-center gap-2 text-lg font-semibold text-blue-700 hover:text-blue-900"
      >
        <ArrowLeft className="h-5 w-5 shrink-0" />
        {opened ? t.bookPageBackList : t.bookPageBack}
      </button>

      <h1 className="text-2xl font-extrabold text-blue-900 sm:text-4xl">{t.navBook}</h1>

      {!opened ? (
        <>
          {/* Шаг 1: карточки тем — крупная иконка, кнопка «Прослушать»,
              заголовок, короткое описание и кнопка-призыв, точь-в-точь как
              карточки раздела «Узнать об опасностях». */}
          <p className="mt-4 max-w-2xl text-lg leading-relaxed text-slate-600">
            {t.bookChaptersHeading}
          </p>
          <div className="mt-8 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
            {CHAPTERS.map((c, i) => {
              const emoji = CHAPTERS_EMOJI[i] || "📱";
              const theme = CHAPTERS_CARD_THEMES[i % CHAPTERS_CARD_THEMES.length];
              const short = chapterShortText(c.paragraphs && c.paragraphs[0]);
              return (
                <div
                  key={i}
                  role="button"
                  tabIndex={0}
                  onClick={() => selectChapter(i)}
                  onKeyDown={(e) => {
                    if (e.key === "Enter" || e.key === " ") {
                      e.preventDefault();
                      selectChapter(i);
                    }
                  }}
                  className={
                    "flex cursor-pointer flex-col gap-3 rounded-3xl border-2 p-5 text-left shadow-sm transition hover:-translate-y-0.5 hover:shadow-md active:scale-[0.99] sm:p-6 " +
                    theme.card
                  }
                >
                  <div className="flex items-start justify-between gap-3">
                    <div
                      className={
                        "flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl text-4xl leading-none sm:h-16 sm:w-16 " +
                        theme.badge
                      }
                      aria-hidden="true"
                    >
                      {emoji}
                    </div>
                    <SpeakButton id={`book-card-${i}`} text={withPause(c.title, short)} />
                  </div>

                  <h2 className="mt-1 text-xl font-extrabold leading-snug text-blue-950 sm:text-2xl">
                    {c.title}
                  </h2>
                  {short && <p className="text-base leading-relaxed text-slate-700">{short}</p>}

                  <span className="mt-2 inline-flex items-center gap-1.5 text-lg font-bold text-blue-700">
                    {t.bookCardCta}
                    <ArrowRight className="h-5 w-5" />
                  </span>
                </div>
              );
            })}
          </div>
        </>
      ) : (
        <>
          {/* Прогресс */}
          <div className="mt-5">
            <div className="flex items-center justify-between text-base font-semibold text-blue-800">
              <span>{t.chapterOf(chapter + 1, total)}</span>
              <span>{Math.round(((chapter + 1) / total) * 100)}%</span>
            </div>
            <div className="mt-2 h-3 w-full overflow-hidden rounded-full bg-blue-100">
              <div
                className="h-full rounded-full bg-blue-600 transition-all"
                style={{ width: `${((chapter + 1) / total) * 100}%` }}
              />
            </div>
          </div>

          {/*
            Шаг 2: тот же паттерн «список сбоку + контент рядом», что и в
            разделе «Опасности» (DangerDetailPage): на мобильном —
            горизонтальная лента глав сверху, на десктопе — закреплённый
            список слева, а содержимое открытой главы всегда СПРАВА от
            списка, а не под ним снизу.
          */}
          <div className="mt-7 flex flex-col gap-6 md:flex-row md:items-start md:gap-7">
            {/* Мобильная лента выбора главы — всегда видна, ничего не сворачивается */}
            <nav className="md:hidden" aria-label={t.navAriaMobileChapters}>
              <div className="-mx-1 flex gap-2 overflow-x-auto px-1 pb-1">
                {CHAPTERS.map((c, i) => {
                  const CIcon = c.icon;
                  const active = i === chapter;
                  return (
                    <button
                      key={i}
                      onClick={() => selectChapter(i)}
                      aria-current={active ? "true" : undefined}
                      className={
                        "flex min-h-11 shrink-0 items-center gap-2 whitespace-nowrap rounded-2xl px-3.5 py-2.5 text-sm font-semibold transition " +
                        (active
                          ? "bg-blue-700 text-white shadow-sm"
                          : "border border-blue-100 bg-white text-blue-900")
                      }
                    >
                      <span
                        className={
                          "flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-xs font-bold " +
                          (active ? "bg-white/20 text-white" : "bg-blue-100 text-blue-700")
                        }
                      >
                        {i + 1}
                      </span>
                      <CIcon className="h-4 w-4 shrink-0" />
                      {c.title}
                    </button>
                  );
                })}
              </div>
            </nav>

            {/* Desktop-колонка: постоянный список всех глав слева */}
            <nav className="hidden shrink-0 md:block md:w-72" aria-label={t.navAriaDesktopChapters}>
              <ol className="sticky top-24 space-y-1 rounded-3xl border border-blue-100 bg-white p-3 shadow-sm">
                {CHAPTERS.map((c, i) => {
                  const CIcon = c.icon;
                  const active = i === chapter;
                  return (
                    <li key={i}>
                      <button
                        onClick={() => selectChapter(i)}
                        aria-current={active ? "true" : undefined}
                        className={
                          "flex w-full items-center gap-3 rounded-2xl px-3 py-2.5 text-left text-base font-semibold transition " +
                          (active
                            ? "bg-blue-700 text-white shadow-sm"
                            : "text-blue-900 hover:bg-blue-50")
                        }
                      >
                        <span
                          className={
                            "flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-xs font-bold " +
                            (active ? "bg-white/20 text-white" : "bg-blue-100 text-blue-700")
                          }
                        >
                          {i + 1}
                        </span>
                        <CIcon className="h-5 w-5 shrink-0" />
                        <span className="leading-snug">{c.title}</span>
                      </button>
                    </li>
                  );
                })}
              </ol>
            </nav>

            {/* Контент выбранной главы — занимает всё оставшееся пространство справа */}
            <div ref={chapterContentRef} className="min-w-0 flex-1">
              <div className="rounded-3xl border border-blue-100 bg-white p-5 shadow-sm sm:p-9">
                <div className="flex flex-wrap items-center justify-between gap-4">
                  <div className="flex min-w-0 items-center gap-3 sm:gap-4">
                    <div className="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-blue-100 sm:h-14 sm:w-14">
                      <Icon className="h-7 w-7 text-blue-700 sm:h-8 sm:w-8" />
                    </div>
                    <h2 className="text-xl font-bold text-blue-900 sm:text-3xl">
                      {t.chapterHeading(chapter + 1, ch.title)}
                    </h2>
                  </div>
                  <SpeakButton
                    id={`book-chapter-${chapter}`}
                    text={withPause(ch.title, ch.paragraphs.join(" "))}
                  />
                </div>
                <div className="mt-6 space-y-4">
                  {ch.paragraphs.map((p, i) => (
                    <p key={i} className="text-lg leading-relaxed text-slate-700">
                      {p}
                    </p>
                  ))}
                </div>
                {ch.tip && (
                  <div className="mt-6 flex flex-wrap items-start justify-between gap-3 rounded-2xl bg-blue-50 p-5">
                    <div className="flex flex-1 gap-3">
                      <Info className="mt-1 h-5 w-5 shrink-0 text-blue-700" />
                      <p className="text-base font-medium leading-relaxed text-blue-900">{ch.tip}</p>
                    </div>
                    <SpeakButton id={`book-tip-${chapter}`} text={withPause(t.tipLabel, ch.tip)} />
                  </div>
                )}
              </div>

              <div className="mt-6 flex flex-wrap items-stretch justify-between gap-3">
                <button
                  onClick={() => setChapter((c) => Math.max(0, c - 1))}
                  disabled={chapter === 0}
                  className="flex min-h-12 min-w-[8.5rem] flex-1 items-center justify-center gap-2 rounded-2xl border-2 border-blue-200 bg-white px-4 py-3 text-base font-bold text-blue-800 shadow-sm transition hover:bg-blue-50 disabled:cursor-not-allowed disabled:opacity-40 sm:flex-none sm:px-5 sm:py-4 sm:text-lg"
                >
                  <ChevronLeft className="h-5 w-5 shrink-0" />
                  {t.back}
                </button>
                <button
                  onClick={() => setChapter((c) => Math.min(total - 1, c + 1))}
                  disabled={chapter === total - 1}
                  className="flex min-h-12 min-w-[8.5rem] flex-1 items-center justify-center gap-2 rounded-2xl bg-blue-700 px-4 py-3 text-base font-bold text-white shadow-sm transition hover:bg-blue-800 disabled:cursor-not-allowed disabled:opacity-40 sm:flex-none sm:px-5 sm:py-4 sm:text-lg"
                >
                  {t.next}
                  <ChevronRight className="h-5 w-5 shrink-0" />
                </button>
              </div>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  Страница: Тест «Уровень цифровой грамотности»                        */
/* ---------------------------------------------------------------------- */

const TEST_LEVELS = [
  { id: "easy", theme: "bg-emerald-50 border-emerald-200 hover:bg-emerald-100" },
  { id: "medium", theme: "bg-amber-50 border-amber-200 hover:bg-amber-100" },
  { id: "hard", theme: "bg-rose-50 border-rose-200 hover:bg-rose-100" },
];

function DigitalLiteracyTestPage({ go, onStudyTopic }) {
  const { lang, t } = useLang();
  const QUIZ = useMemo(() => getQuiz(lang), [lang]);

  const [level, setLevel] = useState(null);
  const [qIndex, setQIndex] = useState(0);
  const [selected, setSelected] = useState(null);
  const [answers, setAnswers] = useState([]);
  const [showError, setShowError] = useState(false);

  const questions = level ? QUIZ[level] || [] : [];
  const total = questions.length;
  const finished = level !== null && qIndex >= total && total > 0;
  const current = !finished ? questions[qIndex] : null;

  const levelLabels = {
    easy: t.testLevelEasy,
    medium: t.testLevelMedium,
    hard: t.testLevelHard,
  };

  const resetToLevels = () => {
    setLevel(null);
    setQIndex(0);
    setSelected(null);
    setAnswers([]);
    setShowError(false);
  };

  const chooseLevel = (id) => {
    setLevel(id);
    setQIndex(0);
    setSelected(null);
    setAnswers([]);
    setShowError(false);
  };

  const retake = () => {
    setQIndex(0);
    setSelected(null);
    setAnswers([]);
    setShowError(false);
  };

  const handleNext = () => {
    if (selected === null) {
      setShowError(true);
      return;
    }
    setAnswers((prev) => [...prev, selected]);
    setSelected(null);
    setShowError(false);
    setQIndex((i) => i + 1);
  };

  const correctCount = useMemo(() => {
    if (!finished) return 0;
    return answers.reduce(
      (sum, a, i) => sum + (questions[i] && a === questions[i].correctIndex ? 1 : 0),
      0
    );
  }, [finished, answers, questions]);

  const mistakes = useMemo(() => {
    if (!finished) return [];
    return questions
      .map((q, i) => ({
        q,
        index: i,
        chosen: answers[i],
      }))
      .filter((item) => item.q && item.chosen !== item.q.correctIndex);
  }, [finished, answers, questions]);

  const percent = total ? Math.round((correctCount / total) * 100) : 0;

  let resultTier = "low";
  if (correctCount >= 6) resultTier = "high";
  else if (correctCount >= 4) resultTier = "medium";

  const tierMeta = {
    high: {
      title: t.testLevelHighTitle,
      desc: t.testLevelHighDesc,
      note: t.testLevelHighNote,
      bg: "bg-emerald-50",
      text: "text-emerald-900",
    },
    medium: {
      title: t.testLevelMediumTitle,
      desc: t.testLevelMediumDesc,
      note: null,
      bg: "bg-amber-50",
      text: "text-amber-900",
    },
    low: {
      title: t.testLevelLowTitle,
      desc: t.testLevelLowDesc,
      note: null,
      bg: "bg-rose-50",
      text: "text-rose-900",
    },
  };
  const tier = tierMeta[resultTier];

  return (
    <div className="mx-auto max-w-4xl px-4 py-8 sm:px-8 sm:py-10">
      <button
        onClick={() => go("home")}
        className="mb-6 flex min-h-11 items-center gap-2 text-lg font-semibold text-blue-700 hover:text-blue-900"
      >
        <ArrowLeft className="h-5 w-5 shrink-0" />
        {t.homeAria}
      </button>

      <h1 className="text-2xl font-extrabold text-blue-900 sm:text-4xl">{t.testHeroTitle}</h1>
      <p className="mt-4 max-w-2xl text-lg leading-relaxed text-slate-600">
        {t.testHeroSubtitle}
      </p>

      {level === null && (
        <div className="mt-8">
          <h2 className="mb-4 text-xl font-bold text-blue-900">{t.testChooseLevelHeading}</h2>
          <div className="grid grid-cols-1 gap-5 sm:grid-cols-3">
            {TEST_LEVELS.map((lvl) => (
              <button
                key={lvl.id}
                type="button"
                onClick={() => chooseLevel(lvl.id)}
                className={
                  "flex min-h-12 flex-col items-center justify-center gap-2 rounded-3xl border-2 p-6 text-center shadow-sm transition hover:-translate-y-0.5 hover:shadow-md active:scale-[0.99] sm:p-8 " +
                  lvl.theme
                }
              >
                <span className="text-2xl font-extrabold leading-snug text-blue-950 sm:text-3xl">
                  {levelLabels[lvl.id]}
                </span>
              </button>
            ))}
          </div>
        </div>
      )}

      {level !== null && !finished && current && (
        <div className="mt-8">
          <button
            onClick={resetToLevels}
            className="mb-5 flex items-center gap-2 text-base font-semibold text-blue-700 hover:text-blue-900"
          >
            <ArrowLeft className="h-4 w-4" />
            {t.testBackToLevels}
          </button>

          <div className="flex items-center justify-between text-base font-semibold text-blue-800">
            <span>{t.testQuestionOf(qIndex + 1, total)}</span>
            <span>{Math.round(((qIndex + 1) / total) * 100)}%</span>
          </div>
          <div className="mt-2 h-3 w-full overflow-hidden rounded-full bg-blue-100">
            <div
              className="h-full rounded-full bg-blue-600 transition-all"
              style={{ width: `${((qIndex + 1) / total) * 100}%` }}
            />
          </div>

          <div className="mt-6 rounded-3xl border border-blue-100 bg-white p-5 shadow-sm sm:p-9">
            <div className="flex flex-wrap items-start justify-between gap-4">
              <h2 className="flex-1 text-xl font-bold leading-snug text-blue-900 sm:text-2xl">
                {current.q}
              </h2>
              <SpeakButton id={`test-${level}-${qIndex}`} text={current.q} />
            </div>

            <div className="mt-6 flex flex-col gap-3">
              {current.options.map((opt, i) => {
                const active = selected === i;
                return (
                  <button
                    key={i}
                    type="button"
                    onClick={() => {
                      setSelected(i);
                      setShowError(false);
                    }}
                    aria-pressed={active}
                    className={
                      "w-full min-h-12 rounded-2xl border-2 px-5 py-4 text-left text-lg font-semibold shadow-sm transition active:scale-[0.99] " +
                      (active
                        ? "border-blue-700 bg-blue-50 text-blue-900 ring-2 ring-blue-600"
                        : "border-blue-200 bg-white text-slate-700 hover:border-blue-400 hover:bg-blue-50")
                    }
                  >
                    {opt}
                  </button>
                );
              })}
            </div>

            {showError && (
              <p className="mt-4 text-base font-semibold text-red-600">{t.testSelectError}</p>
            )}

            <div className="mt-7 flex justify-end">
              <button
                type="button"
                onClick={handleNext}
                className="flex min-h-12 w-full items-center justify-center gap-2 rounded-2xl bg-blue-700 px-6 py-4 text-lg font-bold text-white shadow-sm transition hover:bg-blue-800 active:scale-95 sm:w-auto"
              >
                {qIndex + 1 === total ? t.testFinishButton : t.testNextButton}
                <ChevronRight className="h-5 w-5" />
              </button>
            </div>
          </div>
        </div>
      )}

      {finished && (
        <div className="mt-8">
          <div className="rounded-3xl border border-blue-100 bg-white p-5 text-center shadow-sm sm:p-10">
            <h2 className="text-xl font-extrabold text-blue-900 sm:text-3xl">
              {t.testResultHeading}
            </h2>
            <p className="mt-4 text-xl font-bold text-slate-800">
              {t.testResultScore(correctCount, total)}
            </p>
            <p className="mt-1 text-lg text-slate-500">{percent}%</p>

            <div className={"mx-auto mt-6 max-w-md rounded-2xl p-6 " + tier.bg}>
              <p className={"text-2xl font-extrabold " + tier.text}>{tier.title}</p>
              <p className="mt-2 text-lg leading-relaxed text-slate-700">{tier.desc}</p>
              {tier.note && (
                <p className="mt-2 text-base leading-relaxed text-slate-600">{tier.note}</p>
              )}
              <div className="mt-4 flex justify-center">
                <SpeakButton
                  id={`test-result-${level}`}
                  text={withPause(tier.title, [tier.desc, tier.note].filter(Boolean).join(" "))}
                />
              </div>
            </div>

            <div className="mt-8 flex flex-col items-center gap-3 sm:flex-row sm:justify-center">
              <button
                type="button"
                onClick={retake}
                className="flex w-full items-center justify-center gap-2 rounded-2xl bg-blue-700 px-6 py-4 text-lg font-bold text-white shadow-sm transition hover:bg-blue-800 active:scale-95 sm:w-auto"
              >
                {t.testRetakeButton}
              </button>
              <button
                type="button"
                onClick={resetToLevels}
                className="flex w-full items-center justify-center gap-2 rounded-2xl border-2 border-blue-200 bg-white px-6 py-4 text-lg font-bold text-blue-800 shadow-sm transition hover:bg-blue-50 active:scale-95 sm:w-auto"
              >
                {t.testBackToLevels}
              </button>
            </div>
          </div>

          {mistakes.length > 0 && (
            <section className="mt-6" aria-labelledby="test-review-heading">
              <div className="rounded-3xl border border-blue-100 bg-white p-5 shadow-sm sm:p-8">
                <h3
                  id="test-review-heading"
                  className="text-left text-xl font-extrabold text-blue-900 sm:text-2xl"
                >
                  {t.testReviewHeading}
                </h3>
                <p className="mt-2 text-left text-base leading-relaxed text-slate-600 sm:text-lg">
                  {t.testReviewIntro}
                </p>

                <div className="mt-5 flex flex-col gap-4">
                  {mistakes.map((item) => {
                    const chosenText =
                      item.chosen != null && item.q.options[item.chosen] != null
                        ? item.q.options[item.chosen]
                        : "—";
                    const correctText = item.q.options[item.q.correctIndex];
                    return (
                      <article
                        key={item.index}
                        className="rounded-3xl border border-blue-100 bg-blue-50/40 p-4 sm:p-6"
                      >
                        <p className="text-sm font-bold uppercase tracking-wide text-blue-700">
                          {t.testReviewQuestion(item.index + 1)}
                        </p>
                        <h4 className="mt-1 text-lg font-bold leading-snug text-blue-900 sm:text-xl">
                          {item.q.q}
                        </h4>

                        <div className="mt-4 flex flex-col gap-3">
                          <div className="flex items-start gap-3 rounded-2xl border-2 border-red-200 bg-red-50 p-3 sm:p-4">
                            {XCircle ? (
                              <XCircle className="mt-0.5 h-6 w-6 shrink-0 text-red-600" />
                            ) : (
                              <span className="shrink-0 text-xl font-bold text-red-600" aria-hidden="true">
                                ✗
                              </span>
                            )}
                            <div className="min-w-0">
                              <p className="text-sm font-bold text-red-700">{t.testYourAnswer}</p>
                              <p className="mt-1 text-base font-semibold leading-snug text-red-900">
                                {chosenText}
                              </p>
                            </div>
                          </div>

                          <div className="flex items-start gap-3 rounded-2xl border-2 border-emerald-200 bg-emerald-50 p-3 sm:p-4">
                            {CheckCircle2 ? (
                              <CheckCircle2 className="mt-0.5 h-6 w-6 shrink-0 text-emerald-700" />
                            ) : (
                              <span className="shrink-0 text-xl font-bold text-emerald-700" aria-hidden="true">
                                ✓
                              </span>
                            )}
                            <div className="min-w-0">
                              <p className="text-sm font-bold text-emerald-800">{t.testCorrectAnswer}</p>
                              <p className="mt-1 text-base font-semibold leading-snug text-emerald-900">
                                {correctText}
                              </p>
                            </div>
                          </div>
                        </div>

                        {item.q.explanation ? (
                          <p className="mt-4 text-base leading-relaxed text-slate-700">
                            <span className="font-bold text-blue-900">{t.testWhyHeading}. </span>
                            {item.q.explanation}
                          </p>
                        ) : null}

                        {onStudyTopic && item.q.relatedSection ? (
                          <button
                            type="button"
                            onClick={() => onStudyTopic(item.q.relatedSection)}
                            className="mt-4 flex min-h-12 w-full items-center justify-center gap-2 rounded-full bg-blue-700 px-5 py-3 text-base font-bold text-white shadow-sm transition hover:bg-blue-800 active:scale-95 sm:w-auto"
                          >
                            {t.testStudyTopic}

function SiteMenu({ open, onClose, go, page }) {
  const { t } = useLang();

  useEffect(() => {
    if (!open) return undefined;
    const onKey = (e) => {
      if (e.key === "Escape") onClose();
    };
    document.addEventListener("keydown", onKey);
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => {
      document.removeEventListener("keydown", onKey);
      document.body.style.overflow = prevOverflow;
    };
  }, [open, onClose]);

  if (!open) return null;

  const items = [
    { id: "dangers", label: t.navDangers, Icon: ShieldAlert, active: page === "dangers" || page === "danger" },
    { id: "whatif", label: t.navWhatIf, Icon: Info, active: page === "whatif" },
    { id: "book", label: t.navBook, Icon: Smartphone, active: page === "book" },
    { id: "test", label: t.navTest, Icon: Brain, active: page === "test" },

  return (
    <div className="fixed inset-0 z-[9000]" role="dialog" aria-modal="true" aria-labelledby="site-menu-title">

const SCALE_LEVELS = [1, 1.15, 1.3, 1.45];

function AppInner() {
  const { t } = useLang();
  const [page, setPage] = useState("home"); // home | dangers | danger | whatif | book | test | videos
  const [dangerId, setDangerId] = useState(DANGERS_META[0].id);
  const [chapter, setChapter] = useState(0);
  const [scaleLevel, setScaleLevel] = useState(0);
  const [emergencyOpen, setEmergencyOpen] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [bookStartOpened, setBookStartOpened] = useState(false);
  const [whatIfOpenId, setWhatIfOpenId] = useState(null);
  const contentRef = useRef(null);

  // Общая (глобальная) озвучка использует тот же SpeechContext, что и
  // локальные кнопки «Прослушать» — под специальным id "__global__". Это
  // гарантирует, что одновременно звучит только что-то одно: включение
  // локальной озвучки блока остановит общую, и наоборот.
  const { activeId, speak, stop } = useSpeech();
  const speaking = activeId === "__global__";

  const go = useCallback(
    (p, opts) => {
      stop();
      setMenuOpen(false);
      if (p === "book" && opts && typeof opts.chapter === "number") {
        setChapter(opts.chapter);
        setBookStartOpened(true);
      } else {
        setBookStartOpened(false);
      }
      if (p === "whatif") {
        setWhatIfOpenId(opts && opts.id ? opts.id : null);
      } else {
        setWhatIfOpenId(null);
      }
      setPage(p);
      window.scrollTo({ top: 0, behavior: "smooth" });
    },
    [stop]
  );

  const openDanger = useCallback(
    (id) => {
      stop();
      setMenuOpen(false);
      setBookStartOpened(false);
      setWhatIfOpenId(null);
      setDangerId(id);
      setPage("danger");
      window.scrollTo({ top: 0, behavior: "smooth" });
    },
    [stop]
  );

  const studyTopic = useCallback(
    (related) => {
      if (!related) {
        go("dangers");
        return;
      }
      if (related.page === "danger" && related.id) {
        openDanger(related.id);
        return;
      }
      if (related.page === "book") {
        go("book", { chapter: related.chapter });
        return;
      }
      if (related.page === "whatif") {
        go("whatif", { id: related.id });
        return;
      }
      go(related.page || "dangers");
    },
    [go, openDanger]
  );

  const handleScale = () => setScaleLevel((l) => (l + 1) % SCALE_LEVELS.length);

  // Увеличение только текста: меняем CSS-переменную --a11y-text-scale.
  // html { font-size } не трогаем — иначе вместе с текстом вырастут все
  // rem-размеры Tailwind (иконки w-/h-, отступы, контейнеры).
  useEffect(() => {
    if (typeof document === "undefined") return;
    document.documentElement.style.setProperty(
      "--a11y-text-scale",
      String(SCALE_LEVELS[scaleLevel])
    );
    return () => {
      document.documentElement.style.removeProperty("--a11y-text-scale");
    };
  }, [scaleLevel]);

  const handleSpeak = () => {
    if (speaking) {
      stop();
      return;
    }
    const text = contentRef.current ? contentRef.current.innerText : "";
    speak("__global__", text);
  };

  useEffect(() => {
    stop();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [page, dangerId, chapter]);

  return (
    <div className="min-h-screen bg-blue-50/40 font-sans text-slate-800">
      {/*
        Шапка — обычный элемент в потоке страницы (position: static),
        поэтому она прокручивается вместе с остальным содержимым и не
        остаётся зафиксированной поверх контента при скролле.
      */}
      <header className="relative border-b border-blue-100 bg-white">
        <div className="mx-auto w-full min-w-0 max-w-5xl px-3 py-2.5 sm:px-6">
          <div className="flex items-center justify-between gap-2">
            <div className="flex min-w-0 items-center gap-2">
              <button
                type="button"
                onClick={() => setMenuOpen(true)}
                aria-label={t.navMenu}
                aria-expanded={menuOpen}
                aria-haspopup="dialog"
                className="flex h-11 w-11 shrink-0 items-center justify-center rounded-full border-2 border-blue-200 bg-white text-blue-800 shadow-sm transition hover:border-blue-400 hover:bg-blue-50 active:scale-95"
              >
                {Menu ? <Menu className="h-5 w-5" /> : <span aria-hidden="true">☰</span>}
              </button>
              <button onClick={() => go("home")} aria-label={t.homeAria} className="min-w-0">
                <Logo />
              </button>
            </div>
            <button
              type="button"
              onClick={() => go("home")}
              aria-label={t.homeAria}
              className={
                "flex min-h-11 shrink-0 items-center gap-1.5 rounded-full border-2 px-3 py-2 text-sm font-semibold shadow-sm transition active:scale-95 " +
                (page === "home"
                  ? "border-blue-700 bg-blue-700 text-white"
                  : "border-blue-200 bg-white text-blue-800 hover:border-blue-400 hover:bg-blue-50")
              }
            >
              {Home && <Home className="h-4 w-4 shrink-0" />}
              <span className="whitespace-nowrap">{t.navHome}</span>
            </button>
          </div>
        </div>
        <div className="border-t border-blue-100">
          <div className="mx-auto flex w-full min-w-0 max-w-5xl justify-start px-3 py-2.5 sm:px-6">
            <AccessibilityBar
              scaleLevel={scaleLevel}
              onScale={handleScale}
              speaking={speaking}
              onSpeak={handleSpeak}
            />
          </div>
        </div>
      </header>

      <SiteMenu open={menuOpen} onClose={() => setMenuOpen(false)} go={go} page={page} />

      {/*
        Увеличение текста применяется через --a11y-text-scale на <html>
        (см. useEffect выше). Этот <div> — только структурная обёртка.
      */}
      <div>
        <main ref={contentRef}>
          {page === "home" && <HomePage go={go} />}
          {page === "dangers" && <DangersListPage go={go} openDanger={openDanger} />}
          {page === "whatif" && <WhatIfPage go={go} initialOpenId={whatIfOpenId} />}
          {page === "danger" && (
            <DangerDetailPage id={dangerId} go={go} openDanger={openDanger} />
          )}
          {page === "book" && (
            <BookPage
              go={go}
              chapter={chapter}
              setChapter={setChapter}
              startOpened={bookStartOpened}
            />
          )}
          {page === "test" && <DigitalLiteracyTestPage go={go} onStudyTopic={studyTopic} />}
          {page === "videos" && <VideosPage go={go} />}
        </main>

        <footer className="mt-10 border-t border-blue-100 bg-white py-8 pb-28 sm:pb-8">
          <div className="mx-auto max-w-5xl px-4 text-center text-base leading-relaxed text-slate-500 sm:px-8">
            <p>{t.footerText}</p>
          </div>
        </footer>
      </div>

      {/* Плавающая кнопка экстренной помощи (выше шапки, но ниже модалки) */}
      <button
        onClick={() => setEmergencyOpen(true)}
        className="fixed bottom-5 right-3 z-[10000] flex max-w-[7.25rem] items-center gap-1.5 rounded-full bg-red-600 px-3 py-2.5 text-[13px] font-bold leading-tight text-white shadow-2xl transition hover:bg-red-700 active:scale-95 sm:bottom-6 sm:right-6 sm:max-w-none sm:gap-2 sm:px-6 sm:py-4 sm:text-lg"
      >
        <PhoneCall className="h-5 w-5 shrink-0 sm:h-6 sm:w-6" />
        {t.emergencyButton}
      </button>

      <EmergencyModal
        open={emergencyOpen}
        onClose={() => {
          stop();
          setEmergencyOpen(false);
        }}
      />
    </div>
  );
}

function App() {
  return (
    <ThemeProvider>
      <LangProvider>
        <SpeechProvider>
          <AppInner />
        </SpeechProvider>
      </LangProvider>
    </ThemeProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<!--
  Единый последовательный загрузчик (см. подробный комментарий в <head>).
  Каждая критичная библиотека грузится с основного источника (unpkg), а при
  сбое — автоматически со второго CDN (jsDelivr) той же версии. Только когда
  ВСЕ они гарантированно загружены и создали свои глобальные переменные,
  выполняется транспиляция JSX из #app-source (с явной опцией
  { runtime: "classic" }, чтобы результат всегда был обычным
  React.createElement(...), независимо от версии Babel) и запуск
  приложения. Если сеть/CDN всё же недоступны — вместо белого экрана
  показывается понятное сообщение в #root.
-->
<script>
(function () {
  function loadScript(urls, isReady) {
    return new Promise(function (resolve, reject) {
      var i = 0;
      function tryNext() {
        if (i >= urls.length) {
          reject(new Error('Не удалось загрузить ни с одного источника: ' + urls.join(', ')));
          return;
        }
        var url = urls[i++];
        var el = document.createElement('script');
        el.src = url;
        el.onload = function () {
          if (!isReady || isReady()) resolve();
          else tryNext();
        };
        el.onerror = function () { tryNext(); };
        document.head.appendChild(el);
      }
      tryNext();
    });
  }

  loadScript(
    [
      'https://unpkg.com/react@18/umd/react.production.min.js',
      'https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js',
    ],
    function () { return typeof window.React !== 'undefined'; }
  )
    .then(function () {
      return loadScript(
        [
          'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
          'https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js',
        ],
        function () { return typeof window.ReactDOM !== 'undefined'; }
      );
    })
    .then(function () {
      // Версия закреплена (7.29.8): без версии unpkg отдаёт "latest", а это
      // сейчас Babel 8.x, у которого @babel/preset-react по умолчанию
      // использует JSX-runtime "automatic" (вставляет
      // `import ... from "react/jsx-runtime"`, что ломается в обычном
      // скрипте). Мы всё равно передаём { runtime: 'classic' } явно ниже —
      // двойная защита от повторного дрейфа версии CDN.
      return loadScript(
        [
          'https://unpkg.com/@babel/standalone@7.29.8/babel.min.js',
          'https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.8/babel.min.js',
        ],
        function () { return typeof window.Babel !== 'undefined'; }
      );
    })
    .then(function () {
      // UMD-сборка lucide-react ищет React через глобальную переменную
      // нижнего регистра `react`, а не `React` — создаём алиас до её загрузки.
      window.react = window.React;
      return loadScript(
        [
          'https://unpkg.com/lucide-react@0.379.0/dist/umd/lucide-react.js',
          'https://cdn.jsdelivr.net/npm/lucide-react@0.379.0/dist/umd/lucide-react.js',
        ],
        function () { return typeof window.LucideReact !== 'undefined'; }
      );
    })
    .then(function () {
      var sourceCode = document.getElementById('app-source').textContent;
      var compiled = Babel.transform(sourceCode, {
        presets: [['react', { runtime: 'classic' }]],
        filename: 'app.jsx',
      }).code;
      var runnable = document.createElement('script');
      runnable.text = compiled;
      document.body.appendChild(runnable);

      // ДИАГНОСТИКА ШРИФТА: через секунду после монтирования приложения
      // выводим в консоль реально вычисленный (computed) font-family для
      // H1, параграфа, кнопки и навигации — так можно за секунду убедиться,
      // что Nunito Sans/Nunito действительно применился, а не просто
      // прописан в CSS. Открыть можно через F12 → Console.
      setTimeout(function () {
        var probes = [
          ['H1 (заголовок)', document.querySelector('h1')],
          ['Параграф (p)', document.querySelector('p')],
          ['Кнопка (button)', document.querySelector('button')],
          ['Навигация (nav)', document.querySelector('nav')],
        ];
        console.log('%c[Проверка шрифта]', 'font-weight:bold;color:#1d4ed8;');
        probes.forEach(function (probe) {
          var label = probe[0];
          var el = probe[1];
          if (!el) {
            console.log(label + ': элемент не найден на этой странице');
            return;
          }
          var computed = window.getComputedStyle(el).fontFamily;
          console.log(label + ' → font-family: ' + computed);
        });
      }, 1000);
    })
    .catch(function (err) {
      console.error('Не удалось запустить приложение:', err);
      document.getElementById('root').innerHTML =
        '<div style="max-width:640px;margin:80px auto;padding:24px;' +
        'font-family:sans-serif;text-align:center;color:#7f1d1d;' +
        'background:#fee2e2;border-radius:16px;">' +
        '<b>Не удалось загрузить необходимые библиотеки с CDN.</b><br/>' +
        'Проверьте подключение к интернету и обновите страницу. ' +
        'Подробности — в консоли браузера (F12).</div>';
    });
})();
</script>
</body>
</html>
