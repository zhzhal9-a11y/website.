<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
<title>Цифровая грамотность и безопасность</title>

<!--
  АРХИТЕКТУРНЫЙ ФИКС ("Babel is not defined"):
  Раньше React/ReactDOM/Babel/Lucide подключались раздельными статическими
  <script src> тегами. Это НЕ гарантирует надёжность: если ЛЮБОЙ из них не
  загрузился (сеть, блокировка провайдером/расширением, таймаут, временная
  проблема самого unpkg на конкретном versioned-пути) — браузер просто тихо
  идёт дальше к следующему тегу, а не останавливается и не сообщает об этом.
  Итог именно так и проявился: "Uncaught ReferenceError: Babel is not
  defined" — тег с Babel по какой-то причине не выполнился, а сама HTML-
  разметка не знала об этом и не могла ничего исправить.
  Ниже — единый загрузчик, который:
    1) грузит библиотеки СТРОГО последовательно (React → ReactDOM → Babel →
       Lucide), и следующий шаг стартует только когда предыдущий
       гарантированно отработал — порядок больше не зависит от скорости
       сети или порядка тегов в разметке;
    2) для КАЖДОЙ библиотеки задано зеркало-фолбэк на jsDelivr: если основной
       источник (unpkg) не ответил или ответил, но не создал ожидаемую
       глобальную переменную — автоматически подставляется второй CDN той
       же самой версии;
    3) если оба CDN всё равно недоступны — вместо тихого белого экрана в
       #root выводится понятное сообщение об ошибке сети, а не пустая
       страница.
  Tailwind Play CDN не входит в эту цепочку — он влияет только на CSS и не
  может привести к белому экрану, поэтому подключается независимо.
-->
<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<script>
  // Надёжная загрузка шрифта с фолбэком между источниками — та же логика
  // отказоустойчивости, что используется ниже для React/Babel/Lucide.
  // Если основной источник (Google Fonts) недоступен в сети пользователя,
  // автоматически подключаются резервные CDN (unpkg / jsDelivr) с тем же
  // самым шрифтом (пакеты Fontsource), включающим кириллицу.
  (function loadFontStylesheets() {
    var sources = [
      "https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800;900&family=Nunito:wght@400;500;600;700;800;900&display=swap",
      "https://unpkg.com/@fontsource-variable/nunito-sans/index.css",
      "https://cdn.jsdelivr.net/npm/@fontsource-variable/nunito-sans/index.css",
      "https://unpkg.com/@fontsource/nunito@5.0.9/index.css",
      "https://cdn.jsdelivr.net/npm/@fontsource/nunito@5.0.9/index.css",
    ];
    var i = 0;
    function tryNext() {
      if (i >= sources.length) return;
      var url = sources[i++];
      var link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = url;
      link.onerror = tryNext;
      document.head.appendChild(link);
    }
    tryNext();
  })();
</script>

<!--
  ТИПОГРАФИКА (глобальный форс-оверрайд):
  Шрифт для ВСЕГО сайта — Nunito Sans / Nunito (округлый, геометричный,
  жирный, дружелюбный, отлично читается). Оба семейства официально
  поддерживают кириллицу, значит буквы вроде "ә, і, ң, ғ, ұ, қ, ө, һ"
  (казахский) тоже отрисуются этим шрифтом, а не фолбэком.
  Ниже стоит УНИВЕРСАЛЬНЫЙ CSS-правило с !important — оно гарантированно
  перебивает ЛЮБОЙ Tailwind-класс (font-sans и т.п.), инлайн-стили или
  унаследованные объявления шрифта, откуда бы они ни пришли.
-->

<script>
  // Дублируем регистрацию в конфиге Tailwind (CDN-версия) — не обязательно
  // при наличии !important ниже, но оставлено как дополнительный уровень
  // защиты на случай, если !important-блок будет случайно удалён/изменён.
  window.tailwind = window.tailwind || {};
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        fontFamily: {
          sans: [
            "Nunito Sans",
            "Nunito",
            "ui-sans-serif",
            "system-ui",
            "-apple-system",
            "Segoe UI",
            "Roboto",
            "sans-serif",
          ],
        },
      },
    },
  };
</script>

<script>
  // Раннее применение темы (светлая/тёмная) — выполняется ДО отрисовки
  // React-приложения, чтобы страница сразу открывалась в правильной теме
  // и не было "мигания" (сначала светлая, потом резко тёмная).
  // Приоритет выбора темы:
  //   1) то, что пользователь уже выбирал раньше (localStorage "dc_theme"),
  //   2) иначе — системная настройка устройства/браузера (prefers-color-scheme),
  //   3) иначе — светлая тема по умолчанию.
  (function applyInitialTheme() {
    try {
      var saved = window.localStorage.getItem("dc_theme");
      var theme =
        saved === "light" || saved === "dark"
          ? saved
          : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      if (theme === "dark") {
        document.documentElement.classList.add("dark");
      }
    } catch (e) {
      /* если localStorage недоступен — просто остаёмся на светлой теме */
    }
  })();
</script>

<style>
  /*
    Явно ГАРАНТИРУЕМ, что ничего на сайте не блокирует масштабирование
    пальцами (pinch-to-zoom) и автоматическое увеличение текста браузером/ОС:
    - touch-action: auto — жест "щипок" (pinch) не перехватывается ни одним
      элементом; !important защищает от любых сторонних стилей (например,
      от базовых стилей Tailwind CDN), которые могли бы задать более узкое
      значение (manipulation/none) на html, body или отдельных элементах.
    - text-size-adjust: 100% — стандартное (не блокирующее) значение:
      предотвращает автоматическое масштабирование текста браузером при
      повороте экрана, но НЕ мешает ни pinch-to-zoom, ни ручному увеличению
      текста через кнопку на сайте, ни системным настройкам размера шрифта.
  */
  html,
  body,
  #root,
  * {
    touch-action: auto !important;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  :root {
    --font-main: "Nunito Sans", "Nunito", "ui-sans-serif", "system-ui",
      -apple-system, "Segoe UI", Roboto, sans-serif;
    /* Масштаб только текста (кнопка «Увеличить текст»). Не путать с
       html { font-size }: его менять нельзя — от него считаются rem-ы
       иконок, отступов и контейнеров Tailwind. */
    --a11y-text-scale: 1;
  }

  /*
    Базовый размер шрифта сайта. Tailwind-классы (и текст, и w-/h-/p-)
    заданы в rem от этого значения. Кнопка «увеличить текст» его НЕ
    меняет: она умножает только текстовые правила через --a11y-text-scale.
  */
  html {
    font-size: 118%;
  }

  /*
    Универсальный форс-оверрайд: перебивает Tailwind font-sans/font-mono/
    font-serif, любые инлайн-стили компонентов и унаследованные шрифты
    браузера/ОС. Действует на КАЖДЫЙ элемент документа, включая формы,
    кнопки, модалки, уведомления и переключатель языка.
  */
  html,
  body,
  button,
  input,
  textarea,
  select,
  option,
  #root,
  * {
    font-family: var(--font-main) !important;
  }

  #root {
    min-height: 100vh;
  }

  /* Единая шкала насыщенности по всему сайту (см. ТЗ):
     H1 = 900, H2/H3 = 800, кнопки/навигация = 700, текст = 400–500. */
  h1 {
    font-weight: 900 !important;
  }
  h2,
  h3 {
    font-weight: 800 !important;
  }
  button,
  nav,
  nav * ,
  [role="navigation"],
  [role="navigation"] * {
    font-weight: 700;
  }
  p,
  span,
  label,
  li,
  input,
  textarea,
  select {
    font-weight: 400;
  }

  /*
    Главный заголовок первого экрана («Цифровая грамотность и
    безопасность»). Плавно масштабируется через clamp():
      - 320px  → ~44px
      - 360px  → ~47px
      - 390px  → ~48px
      - 414px  → ~50px
      - 430px  → ~51px
      - 768px  → ~72px
      - 1024px и шире → фиксированный максимум 88px (совпадает с
        max-w-5xl контейнера, дальше расти уже незачем).
    text-wrap: balance аккуратно распределяет слова по строкам при
    переносе (без "сиротских" отдельных слов); там, где браузер это
    не поддерживает, происходит обычный перенос — ничего не ломается.
  */
  .hero-title {
    font-size: calc(clamp(2.75rem, 1.5rem + 6.25vw, 5.5rem) * var(--a11y-text-scale, 1));
    line-height: 1;
    text-wrap: balance;
    overflow-wrap: break-word;
  }
  @media (max-width: 639px) {
    .hero-title {
      font-size: calc(clamp(1.7rem, 1.1rem + 3.4vw, 2.35rem) * var(--a11y-text-scale, 1));
      line-height: 1.12;
    }
  }

  html,
  body {
    max-width: 100%;
    overflow-x: hidden;
  }
  #root {
    max-width: 100%;
    overflow-x: hidden;
  }

  h1,
  h2,
  h3,
  p,
  li,
  a {
    overflow-wrap: break-word;
  }

  /* Hover-сдвиги только на указателе; на таче не «залипают» после нажатия. */
  @media (hover: none) {
    .safety-card:hover:not([data-open="true"]) {
      transform: none;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    }
    .scenario-option:hover {
      transform: none;
    }
    .hover\:-translate-y-0\.5:hover,
    .hover\:-translate-y-1:hover {
      transform: none !important;
    }
  }

  /* ======================================================================
     ТЁМНАЯ ТЕМА
     ======================================================================
     Сайт написан с фиксированными классами Tailwind (bg-blue-50,
     text-slate-700 и т.п.) без "dark:"-вариантов у каждого элемента —
     переписывать разметку компонент за компонентом было бы огромным и
     рискованным изменением. Вместо этого ниже собран ПОЛНЫЙ список
     реально используемых в файле цветовых классов (получен через grep по
     всей разметке) и для каждого явно задан тёмный эквивалент. Правила
     активируются, когда на <html> есть класс "dark" (его добавляет/убирает
     ThemeProvider). !important гарантирует, что переопределение всегда
     выигрывает у исходного Tailwind-класса.

     Общий принцип подбора цветов:
       - очень светлые "пастельные" фоны (-50/-100)  → тёмные, слегка
         тонированные поверхности (пример: bg-blue-50 → тёмно-синяя
         поверхность вместо почти белой);
       - белые поверхности (bg-white)                → тёмно-синяя/тёмно-
         серая поверхность карточек;
       - тёмный текст, предназначенный для светлого фона (-700/-800/-900)
                                                       → светлые оттенки
         того же цвета (читаемые на тёмном фоне);
       - насыщенные "цветные" фоны кнопок (-600/-700/-800), где уже лежит
         белый текст, оставлены как есть — у них и так достаточный
         контраст в обеих темах.
  */

  html.dark {
    color-scheme: dark;
  }

  /* Базовый фон и текст страницы */
  html.dark body {
    background-color: #0f172a; /* slate-900 */
  }
  html.dark .bg-blue-50\/40 {
    background-color: #0b1220 !important;
  }
  html.dark .text-slate-800 {
    color: #e2e8f0 !important; /* slate-200 */
  }

  /* Белые поверхности (карточки, шапка, подвал, кнопки) */
  html.dark .bg-white {
    background-color: #1e293b !important; /* slate-800 */
  }

  /* Светлые пастельные фоны → тёмные тонированные поверхности */
  html.dark .bg-blue-50 { background-color: rgba(59, 130, 246, 0.14) !important; }
  html.dark .bg-blue-100 { background-color: rgba(59, 130, 246, 0.22) !important; }
  html.dark .bg-emerald-50 { background-color: rgba(16, 185, 129, 0.14) !important; }
  html.dark .bg-emerald-100 { background-color: rgba(16, 185, 129, 0.22) !important; }
  html.dark .bg-amber-50 { background-color: rgba(245, 158, 11, 0.14) !important; }
  html.dark .bg-amber-100 { background-color: rgba(245, 158, 11, 0.22) !important; }
  html.dark .bg-rose-50 { background-color: rgba(244, 63, 94, 0.14) !important; }
  html.dark .bg-rose-100 { background-color: rgba(244, 63, 94, 0.22) !important; }
  html.dark .bg-red-50 { background-color: rgba(239, 68, 68, 0.14) !important; }
  html.dark .bg-sky-50 { background-color: rgba(14, 165, 233, 0.14) !important; }
  html.dark .bg-sky-100 { background-color: rgba(14, 165, 233, 0.22) !important; }
  html.dark .bg-purple-50 { background-color: rgba(168, 85, 247, 0.14) !important; }
  html.dark .bg-purple-100 { background-color: rgba(168, 85, 247, 0.22) !important; }
  html.dark .bg-pink-50 { background-color: rgba(236, 72, 153, 0.14) !important; }
  html.dark .bg-pink-100 { background-color: rgba(236, 72, 153, 0.22) !important; }
  html.dark .bg-green-50 { background-color: rgba(34, 197, 94, 0.14) !important; }
  html.dark .bg-blue-950\/60 { background-color: rgba(2, 6, 23, 0.75) !important; }

  /* Насыщенный текст (создан для светлого фона) → светлые оттенки */
  html.dark .text-blue-900,
  html.dark .text-blue-950 { color: #bfdbfe !important; } /* blue-200 */
  html.dark .text-blue-800,
  html.dark .text-blue-700 { color: #93c5fd !important; } /* blue-300 */
  html.dark .text-slate-700,
  html.dark .text-slate-800 { color: #e2e8f0 !important; } /* slate-200 */
  html.dark .text-slate-600,
  html.dark .text-slate-500 { color: #94a3b8 !important; } /* slate-400 */
  html.dark .text-red-900 { color: #fca5a5 !important; }
  html.dark .text-red-700,
  html.dark .text-red-600 { color: #f87171 !important; }
  html.dark .text-amber-900 { color: #fcd34d !important; }
  html.dark .text-amber-800 { color: #fbbf24 !important; }
  html.dark .text-amber-600 { color: #fbbf24 !important; }
  html.dark .text-rose-900 { color: #fda4af !important; }
  html.dark .text-green-900 { color: #86efac !important; }
  html.dark .text-green-600 { color: #4ade80 !important; }
  html.dark .text-emerald-900 { color: #6ee7b7 !important; }
  html.dark .text-emerald-800,
  html.dark .text-emerald-700 { color: #6ee7b7 !important; }

  /* Тонкие границы пастельных карточек → полупрозрачные светлые линии */
  html.dark .border-blue-50,
  html.dark .border-blue-100,
  html.dark .border-blue-200 { border-color: rgba(148, 163, 184, 0.25) !important; }
  html.dark .border-blue-400 { border-color: rgba(147, 197, 253, 0.5) !important; }
  html.dark .border-amber-200 { border-color: rgba(251, 191, 36, 0.35) !important; }
  html.dark .border-emerald-200 { border-color: rgba(52, 211, 153, 0.35) !important; }
  html.dark .border-sky-200 { border-color: rgba(56, 189, 248, 0.35) !important; }
  html.dark .border-rose-200 { border-color: rgba(251, 113, 133, 0.35) !important; }
  html.dark .border-red-100,
  html.dark .border-red-200 { border-color: rgba(248, 113, 113, 0.35) !important; }
  html.dark .border-purple-200 { border-color: rgba(192, 132, 252, 0.35) !important; }
  html.dark .border-pink-200 { border-color: rgba(244, 114, 182, 0.35) !important; }
  html.dark .border-green-200 { border-color: rgba(74, 222, 128, 0.35) !important; }

  /* Ховеры на светлых пастельных фонах */
  html.dark .hover\:bg-blue-50:hover { background-color: rgba(59, 130, 246, 0.22) !important; }
  html.dark .hover\:bg-emerald-50:hover { background-color: rgba(16, 185, 129, 0.22) !important; }
  html.dark .hover\:bg-emerald-100:hover { background-color: rgba(16, 185, 129, 0.3) !important; }
  html.dark .hover\:bg-amber-100:hover { background-color: rgba(245, 158, 11, 0.3) !important; }
  html.dark .hover\:bg-rose-100:hover { background-color: rgba(244, 63, 94, 0.3) !important; }
  html.dark .hover\:text-blue-900:hover { color: #bfdbfe !important; }

  /* Footer, декоративные разделители на белом/светлом фоне */
  html.dark .border-blue-100 { border-color: rgba(148, 163, 184, 0.25) !important; }

  /* Плавный переход при переключении темы */
  html.dark,
  html.dark body,
  html.dark * {
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }

  /* Интерактивные улучшения: мягкое появление блоков при прокрутке,
     движение карточек и аккуратная реакция иконок. */
  .reveal-on-scroll {
    opacity: 0;
    transform: translateY(22px);
    transition: opacity 0.65s ease, transform 0.65s ease;
    transition-delay: var(--reveal-delay, 0ms);
  }
  .reveal-on-scroll[data-revealed="true"] {
    opacity: 1;
    transform: translateY(0);
  }
  .safety-card {
    transform: translateY(0);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .safety-card:hover,
  .safety-card[data-open="true"] {
    transform: translateY(-5px);
    box-shadow: 0 16px 30px rgba(30, 64, 175, 0.14);
  }
  .safety-card-icon {
    display: inline-flex;
    animation: safety-float 3.5s ease-in-out infinite;
  }
  .safety-card:nth-child(2n) .safety-card-icon { animation-delay: 0.35s; }
  .safety-card:nth-child(3n) .safety-card-icon { animation-delay: 0.7s; }
  .detail-reveal { animation: detail-reveal 0.35s ease both; }
  .scenario-option {
    transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
  }
  .scenario-option:hover { transform: translateX(3px); }
  @keyframes safety-float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-4px) rotate(-3deg); }
  }
  @keyframes detail-reveal {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal-on-scroll,
    .reveal-on-scroll[data-revealed="true"] {
      opacity: 1;
      transform: none;
      transition: none;
    }
    .safety-card,
    .scenario-option { transition: none; }
    .safety-card-icon,
    .detail-reveal { animation: none; }
  }

  /*
    Доступность: увеличение ТОЛЬКО текста.
    Tailwind Play CDN пишет font-size/line-height текстовых утилит в rem
    от html { font-size }. Если менять html font-size, вместе с текстом
    вырастут w-*, h-*, p-*, gap-* (иконки и вёрстка). Поэтому масштаб
    живёт в --a11y-text-scale, а ниже переопределены только текстовые
    классы, реально встречающиеся в разметке. !important нужен, чтобы
    перебить runtime-стили Play CDN.
    Значения — штатная шкала Tailwind v3.
  */
  .text-xs {
    font-size: calc(0.75rem * var(--a11y-text-scale, 1)) !important;
    line-height: calc(1rem * var(--a11y-text-scale, 1)) !important;
  }
  .text-sm {
    font-size: calc(0.875rem * var(--a11y-text-scale, 1)) !important;

const LangContext = createContext(null);

function LangProvider({ children }) {
  const [lang, setLangState] = useState(detectInitialLang);

  const setLang = useCallback((l) => {
    if (!LANGS.includes(l)) return;
    setLangState(l);
    try {
      window.localStorage.setItem("dc_lang", l);
    } catch (e) {
      /* сохранить не удалось — не критично */
    }
  }, []);

  useEffect(() => {
    try {
      document.documentElement.lang = LANG_META[lang].htmlLang;
      document.title = UI[lang].pageTitleTab;
    } catch (e) {
      /* игнорируем */
    }
  }, [lang]);

  const value = useMemo(
    () => ({ lang, setLang, t: UI[lang], meta: LANG_META[lang] }),
    [lang, setLang]
  );

  return <LangContext.Provider value={value}>{children}</LangContext.Provider>;
}

function useLang() {
  const ctx = useContext(LangContext);
  if (!ctx) {
    throw new Error("useLang должен использоваться внутри <LangProvider>");
  }
  return ctx;
}

function LanguageSwitcher({ compact = false }) {
  const { lang, setLang } = useLang();
  return (
    <div
      className={
        "inline-flex h-11 shrink-0 items-center gap-0.5 rounded-full border p-0.5 shadow-sm " +
        (compact ? "border-white/40 bg-white/10" : "border-2 border-blue-200 bg-white")
      }
      role="group"
      aria-label="Language / Тіл / Язык"
    >
      {LANGS.map((l) => {
        const active = l === lang;
        return (
          <button
            key={l}
            type="button"
            onClick={() => setLang(l)}
            aria-pressed={active}
            aria-label={UI[l].languageSwitchAria(LANG_META[l].label)}
            className={
              "h-full rounded-full px-2.5 text-xs font-bold transition active:scale-95 min-w-10 sm:px-3 sm:text-sm " +
              (active
                ? "bg-blue-700 text-white shadow"
                : compact
                ? "text-white/90 hover:bg-white/20"
                : "text-blue-700 hover:bg-blue-50")
            }
          >
            {LANG_META[l].short}
          </button>
        );
      })}
    </div>
  );
}

// Определяем стартовую тему в том же порядке приоритетов, что и
// синхронный скрипт в <head> (см. applyInitialTheme): сохранённый выбор
// пользователя → системная настройка устройства → светлая тема.
// Дублирование логики намеренное: скрипт в <head> убирает "мигание" темы
// до монтирования React, а эта функция синхронизирует с ним начальное
// состояние компонента, чтобы React не "спорил" с уже применённым классом.
function detectInitialTheme() {
  try {
    const saved = window.localStorage.getItem("dc_theme");
    if (saved === "light" || saved === "dark") return saved;
    if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
      return "dark";
    }
  } catch (e) {
    /* localStorage/matchMedia недоступны — остаёмся на светлой теме */
  }
  return "light";
}

const ThemeContext = createContext(null);

function ThemeProvider({ children }) {
  const [theme, setThemeState] = useState(detectInitialTheme);

  const setTheme = useCallback((th) => {
    if (th !== "light" && th !== "dark") return;
    setThemeState(th);
    try {
      window.localStorage.setItem("dc_theme", th);
    } catch (e) {
      /* сохранить не удалось — не критично, тема просто не запомнится */
    }
  }, []);

  const toggleTheme = useCallback(() => {
    setTheme(theme === "dark" ? "light" : "dark");
  }, [theme, setTheme]);

  // Применяем класс "dark" на <html> при каждом изменении темы. Именно
  // этот класс включает переопределения из блока "ТЁМНАЯ ТЕМА" в <style>
  // (см. <head>), а также активирует Tailwind-конфиг darkMode:"class".
  useEffect(() => {
    try {
      document.documentElement.classList.toggle("dark", theme === "dark");
    } catch (e) {
      /* игнорируем */
    }
  }, [theme]);

  const value = useMemo(() => ({ theme, setTheme, toggleTheme }), [theme, setTheme, toggleTheme]);

  return <ThemeContext.Provider value={value}>{children}</ThemeContext.Provider>;
}

function useTheme() {
  const ctx = useContext(ThemeContext);
  if (!ctx) {
    throw new Error("useTheme должен использоваться внутри <ThemeProvider>");
  }
  return ctx;
}

/**
 * Кнопка-переключатель светлой/тёмной темы. Показывает иконку той темы,
 * НА КОТОРУЮ можно переключиться (солнце — предлагает светлую, луна —
 * предлагает тёмную), что совпадает с привычной логикой таких переключателей.
 *
 * compact=true — вариант для плашек над фоновым изображением (как у
 * LanguageSwitcher в компактном режиме): полупрозрачный белый на затемнённой
 * подложке. compact=false — обычная кнопка в стиле остальных элементов
 * AccessibilityBar (белый фон, синяя рамка).
 */
function ThemeToggle({ compact = false }) {
  const { theme, toggleTheme } = useTheme();
  const { t } = useLang();
  const isDark = theme === "dark";

  if (compact) {
    return (
      <button
        type="button"
        onClick={toggleTheme}
        aria-label={isDark ? t.themeToggleAriaToLight : t.themeToggleAriaToDark}
        aria-pressed={isDark}
        className="flex min-h-11 items-center gap-1.5 rounded-full bg-white/10 px-3 py-2 text-xs font-bold text-white shadow-lg transition hover:bg-white/20 active:scale-95 border border-white/40 sm:min-h-0 sm:gap-2 sm:px-4 sm:py-2.5 sm:text-sm"
      >
        {isDark ? (
          <Sun className="h-4 w-4 shrink-0 sm:h-[18px] sm:w-[18px]" />
        ) : (
          <Moon className="h-4 w-4 shrink-0 sm:h-[18px] sm:w-[18px]" />
        )}
        <span className="whitespace-nowrap">{t.themeToggleLabel}</span>
      </button>
    );
  }

  return (
    <button
      type="button"
      onClick={toggleTheme}
      aria-label={isDark ? t.themeToggleAriaToLight : t.themeToggleAriaToDark}
      aria-pressed={isDark}
      className="flex min-h-11 shrink-0 items-center gap-1.5 rounded-full border-2 border-blue-200 bg-white px-3 py-2 text-sm font-semibold text-blue-800 shadow-sm transition hover:border-blue-400 hover:bg-blue-50 active:scale-95"
    >
      {isDark ? <Sun className="h-4 w-4 shrink-0" /> : <Moon className="h-4 w-4 shrink-0" />}
      <span className="whitespace-nowrap">{t.themeToggleLabel}</span>
    </button>
  );
}

function getDangers(lang) {
  const dict = DANGERS_I18N[lang] || DANGERS_I18N.ru;
  return DANGERS_META.map((m) => ({ ...m, ...dict[m.id] }));
}

function getWhatIf(lang) {
  const dict = WHATIF_I18N[lang] || WHATIF_I18N.ru;
  return WHATIF_META.map((m) => ({ ...m, ...dict[m.id] }));
}

// Те же самые пастельные темы, что и у карточек «Узнать об опасностях» —
// чтобы карточки обоих разделов выглядели как часть одного сайта.
const CHAPTERS_CARD_THEMES = DANGERS_CARD_THEMES;

// Короткое описание для карточки главы: первое предложение первого абзаца,
// без изменения исходных текстов глав (используется только для карточки).
function chapterShortText(paragraph) {
  if (!paragraph) return "";
  const match = paragraph.match(/^.*?[.!?…](?=\s|$)/);
  const sentence = match ? match[0] : paragraph;
  return sentence.length > 140 ? sentence.slice(0, 137).trimEnd() + "…" : sentence;
}

function getQuiz(lang) {

  ["easy", "medium", "hard"].forEach((level) => {

      const meta = (QUIZ_META[level] && QUIZ_META[level][i]) || {};

/* ---------------------------------------------------------------------- */
/*  Локальная озвучка отдельных блоков (доп. к общей кнопке «Озвучка»)     */
/* ---------------------------------------------------------------------- */
/*
 * SpeechContext хранит id блока, который сейчас озвучивается (или null).
 * Общая кнопка «Озвучка» в AccessibilityBar использует тот же контекст
 * (со специальным id "__global__"), поэтому в любой момент говорит только
 * один голос: запуск озвучки любого блока автоматически останавливает
 * предыдущую — будь то другой блок или вся страница целиком.
 *
 * Голос озвучки подбирается под ЯЗЫК ИНТЕРФЕЙСА (useLang): при переключении
 * языка меняется не только текст на экране, но и то, какой голос синтеза
 * речи браузер использует для «Прослушать»/«Озвучка».
 */

const SpeechContext = createContext(null);

// Признаки, которые в разных браузерах/ОС обычно указывают на более
// естественно звучащий голос (облачные/нейросетевые голоса), а не на
// базовый системный синтезатор — универсальны для любого языка.
const VOICE_QUALITY_HINTS = ["google", "natural", "online", "neural", "enhanced", "premium", "wavenet"];

// Конкретные системные голоса, которые на практике звучат мягче и спокойнее
// стандартного робота — свои для каждого языка.
const VOICE_NAMED_HINTS = {
  ru: ["milena", "yuri", "irina", "katya", "ekaterina"],
  en: ["samantha", "zira", "david", "aria", "guy", "susan", "mark"],
  kk: ["kazakh", "qazaq"],
};

/**
 * Пытается выбрать наиболее «живой» и естественный голос браузера для
 * заданного языка (ru / kk / en). Список голосов у каждого браузера/ОС свой,
 * поэтому мы не завязываемся на конкретное имя, а оцениваем голоса по
 * распространённым признакам более качественного (не роботизированного)
 * звучания. Если подходящих голосов нет, возвращает null.
 *
 * Важно про казахский: качественное «родное» казахское произношение зависит
 * от наличия казахского голоса в конкретном браузере/ОС пользователя и не
 * может быть гарантировано программно — это ограничение платформы, а не
 * сайта. Большинство систем голоса kk-KZ не содержат. Поэтому
 * pickVoiceForInterface при отсутствии kk-голоса берёт ближайший
 * кириллический (русский), а utterance.lang выставляется по реально
 * выбранному голосу — иначе браузер часто подставляет английский голос
 * по умолчанию, который казахскую кириллицу почти не читает.
 */
function pickBestVoice(voices, langPrefix) {
  if (!voices || !voices.length) return null;

  const matched = voices.filter((v) => (v.lang || "").toLowerCase().startsWith(langPrefix));
  if (!matched.length) return null;

  const namedHints = VOICE_NAMED_HINTS[langPrefix] || [];

  const score = (v) => {
    const name = (v.name || "").toLowerCase();
    let s = 0;
    VOICE_QUALITY_HINTS.forEach((hint) => {
      if (name.includes(hint)) s += 3;
    });
    namedHints.forEach((hint) => {
      if (name.includes(hint)) s += 2;
    });
    if ((v.lang || "").toLowerCase() === `${langPrefix}-${langPrefix}`) s += 1;
    // Голоса, отдаваемые удалённым сервисом браузера, зачастую звучат
    // естественнее локальных офлайн-голосов.
    if (v.localService === false) s += 1;
    return s;
  };

  return matched.slice().sort((a, b) => score(b) - score(a))[0];
}

function pickVoiceForInterface(voices, langCode) {
  const exact = pickBestVoice(voices, langCode);
  if (exact) return exact;
  // Запасной путь только для казахского: кириллическая фонетика русского.
  // Русский и английский сюда не заходят — их подбор не меняется.
  if (langCode === "kk") {
    return pickBestVoice(voices, "ru");
  }
  return null;
}

function SpeechProvider({ children }) {
  const { lang, meta, t } = useLang();
  const [activeId, setActiveId] = useState(null);
  const pauseTimeoutRef = useRef(null);
  const langRef = useRef(lang);
  langRef.current = lang;

  // Некоторые браузеры заполняют список голосов асинхронно — заранее
  // «пробуждаем» его, чтобы к моменту нажатия «Прослушать» голоса уже были
  // доступны.
  useEffect(() => {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.getVoices();
    const onVoicesChanged = () => window.speechSynthesis.getVoices();
    window.speechSynthesis.addEventListener?.("voiceschanged", onVoicesChanged);
    return () => {
      window.speechSynthesis.removeEventListener?.("voiceschanged", onVoicesChanged);
    };
  }, []);

  const clearPauseTimeout = () => {
    if (pauseTimeoutRef.current) {
      clearTimeout(pauseTimeoutRef.current);
      pauseTimeoutRef.current = null;
    }
  };

  const stop = useCallback(() => {
    clearPauseTimeout();
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
    setActiveId(null);
  }, []);

  // При смене языка интерфейса на лету останавливаем текущую озвучку —
  // иначе можно услышать, например, русский голос поверх уже переключённого
  // на английский текста.
  useEffect(() => {
    stop();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [lang]);

  const speak = useCallback(
    (id, text) => {
      if (!("speechSynthesis" in window)) {
        alert(t.speechUnsupported);
        return;
      }
      const clean = (text || "").trim();
      // Остановить предыдущую озвучку, если она идёт, прежде чем начать новую.
      clearPauseTimeout();
      window.speechSynthesis.cancel();
      if (!clean) {
        setActiveId(null);
        return;
      }

      // Заголовок и основной текст разделяются двойным переносом строки
      // (см. хелпер withPause ниже) — это озвучивается как две отдельные
      // фразы с небольшой паузой между ними, что звучит естественнее, чем
      // один сплошной поток речи.
      const segments = clean
        .split(/\n{2,}/)
        .map((s) => s.trim())
        .filter(Boolean);

      const currentLang = langRef.current;
      const currentMeta = LANG_META[currentLang];
      const voice = pickVoiceForInterface(
        window.speechSynthesis.getVoices(),
        currentLang
      );
      // lang голоса и утеранса должны совпадать с реально выбранным Voice.
      // Для kk без своего голоса — ru-RU (кириллица), а не жёсткий kk-KZ.
      const utteranceLang = voice
        ? voice.lang
        : currentLang === "kk"
          ? LANG_META.ru.speechLang
          : currentMeta.speechLang;

      const speakSegment = (index) => {
        if (index >= segments.length) {
          setActiveId((cur) => (cur === id ? null : cur));
          return;
        }
        const utterance = new SpeechSynthesisUtterance(segments[index]);
        utterance.lang = utteranceLang;
        if (voice) utterance.voice = voice;
        // Комфортный, спокойный темп и естественная высота голоса — не
        // мультяшный и не механический.
        utterance.rate = 0.95; // в пределах рекомендованных 0.9–1.0
        utterance.pitch = 1.0;
        utterance.volume = 1.0;
        utterance.onend = () => {
          if (index + 1 < segments.length) {
            // Небольшая пауза между заголовком и основным текстом для более
            // естественного звучания.
            pauseTimeoutRef.current = setTimeout(() => speakSegment(index + 1), 350);
          } else {
            setActiveId((cur) => (cur === id ? null : cur));
          }
        };
        utterance.onerror = () => setActiveId((cur) => (cur === id ? null : cur));
        window.speechSynthesis.speak(utterance);
      };

      speakSegment(0);
      setActiveId(id);
    },
    [t]
  );

  const toggle = useCallback(
    (id, text) => {
      if (activeId === id) {
        stop();
      } else {
        speak(id, text);
      }
    },
    [activeId, speak, stop]
  );

  // На всякий случай останавливаем озвучку, если компонент размонтируется.
  useEffect(() => {
    return () => {
      clearPauseTimeout();
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    };
  }, []);

  return (
    <SpeechContext.Provider value={{ activeId, speak, stop, toggle }}>
      {children}
    </SpeechContext.Provider>
  );
}

/**
 * Склеивает заголовок и основной текст с явным разделителем-паузой, чтобы
 * речь звучала как «заголовок. [пауза] основной текст», а не сплошным
 * потоком.
 */
function withPause(title, body) {
  const t = (title || "").trim();
  const b = (body || "").trim();
  if (!t) return b;
  if (!b) return t;
  const t2 = /[.!?…]$/.test(t) ? t : `${t}.`;
  return `${t2}\n\n${b}`;
}

function useSpeech() {
  const ctx = useContext(SpeechContext);
  if (!ctx) {
    throw new Error("useSpeech должен использоваться внутри <SpeechProvider>");
  }
  return ctx;
}

/**
 * Небольшая, аккуратная кнопка «Прослушать» для конкретного информационного
 * блока. При нажатии озвучивает только переданный текст (а не всю
 * страницу). Повторное нажатие — или запуск озвучки другого блока —
 * останавливает воспроизведение.
 */
function SpeakButton({ id, text, label, tone = "light" }) {
  const { activeId, toggle } = useSpeech();
  const { t } = useLang();
  const resolvedLabel = label || t.listenDefault;
  const isActive = activeId === id;

  // "light" — обычная кнопка на светлом фоне (по умолчанию).
  // "onDark" — вариант для тёмных/цветных плашек (например, синий блок правила).
  const toneClasses =
    tone === "onDark"
      ? isActive
        ? "border-white bg-white text-blue-800 hover:bg-blue-50"
        : "border-white/40 bg-white/10 text-white hover:border-white hover:bg-white/20"
      : isActive
      ? "border-blue-700 bg-blue-700 text-white hover:bg-blue-800"
      : "border-blue-200 bg-white text-blue-700 hover:border-blue-400 hover:bg-blue-50";

  return (
    <button
      type="button"
      onClick={(e) => {
        e.stopPropagation();
        toggle(id, text);
      }}
      aria-label={isActive ? t.listenAriaStopBlock : t.listenAriaStart(resolvedLabel)}
      aria-pressed={isActive}
      className={
        "inline-flex min-h-11 shrink-0 items-center gap-1.5 rounded-full border px-3 py-2 text-sm font-semibold shadow-sm transition active:scale-95 sm:min-h-0 sm:py-1.5 " +
        toneClasses
      }
    >
      {isActive ? (
        <VolumeX className="h-4 w-4 shrink-0" />
      ) : (
        <Volume2 className="h-4 w-4 shrink-0" />
      )}
      {isActive ? t.stop : resolvedLabel}
    </button>
  );
}

function Reveal({ children, delay = 0, className = "" }) {
  const ref = useRef(null);
  const [revealed, setRevealed] = useState(false);

  useEffect(() => {
    const node = ref.current;
    if (!node) return undefined;
    if (!("IntersectionObserver" in window)) {
      setRevealed(true);
      return undefined;
    }
    const observer = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setRevealed(true);
          observer.disconnect();
        }
      },
      { threshold: 0.12 }
    );
    observer.observe(node);
    return () => observer.disconnect();
  }, []);

  return (
    <div
      ref={ref}
      className={`reveal-on-scroll ${className}`}
      data-revealed={revealed ? "true" : "false"}
      style={{ "--reveal-delay": `${delay}ms` }}
    >
      {children}
    </div>
  );
}

    "border-emerald-200 bg-emerald-50",
    "border-sky-200 bg-sky-50",
    "border-purple-200 bg-purple-50",
  ];

  const toggle = (index) => setOpenIndex((current) => (current === index ? null : index));

  return (
    <section className="mx-auto max-w-5xl px-5 pt-12 sm:px-8" aria-labelledby="toolkit-title">

        <div className="mb-7 text-center">

                    toggle(index);

function SafetyScenarios() {
  const { t } = useLang();
  const [scenarioIndex, setScenarioIndex] = useState(0);
  const [answer, setAnswer] = useState(null);
  const current = t.scenarios[scenarioIndex];
  const answered = answer !== null;
  const correct = answer === current.correct;

  useEffect(() => {
    setScenarioIndex(0);
    setAnswer(null);
  }, [t]);

  const next = () => {
    setScenarioIndex((index) => (index + 1) % t.scenarios.length);
    setAnswer(null);
  };

  return (
    <section className="mx-auto max-w-5xl px-5 pt-12 sm:px-8" aria-labelledby="scenario-title">
      <Reveal>
        <div className="rounded-[2rem] bg-gradient-to-br from-blue-700 to-indigo-900 p-5 text-white shadow-xl sm:p-10">
          <div className="flex flex-wrap items-start justify-between gap-4">
            <div>
              <p className="text-sm font-bold uppercase tracking-wide text-blue-200 sm:tracking-[0.18em]">🎭</p>
              <h2 id="scenario-title" className="mt-2 text-2xl font-extrabold sm:text-4xl">
                {t.scenariosTitle}
              </h2>
              <p className="mt-3 max-w-2xl text-lg leading-relaxed text-blue-100">{t.scenariosSubtitle}</p>
            </div>
            <span className="rounded-full bg-white/15 px-4 py-2 text-sm font-bold text-blue-50">
              {scenarioIndex + 1}/{t.scenarios.length}
            </span>
          </div>

          <div className="mt-8 rounded-3xl bg-white p-5 text-slate-800 sm:p-7">
            <h3 className="text-xl font-extrabold leading-relaxed text-blue-950 sm:text-2xl">
              {current.question}
            </h3>
            <div className="mt-5 grid gap-3">
              {current.options.map((option, index) => {
                const selected = answer === index;
                const isCorrect = index === current.correct;
                let stateClass = "border-blue-200 bg-white hover:border-blue-500 hover:bg-blue-50";
                if (answered && isCorrect) stateClass = "border-emerald-500 bg-emerald-50 text-emerald-900";
                if (answered && selected && !isCorrect) stateClass = "border-rose-500 bg-rose-50 text-rose-900";
                return (
                  <button
                    key={option}
                    type="button"
                    disabled={answered}
                    onClick={() => setAnswer(index)}
                    className={`scenario-option flex min-h-12 items-start gap-3 rounded-2xl border-2 p-4 text-left text-base font-semibold leading-relaxed disabled:cursor-default ${stateClass}`}
                  >
                    <span className="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-blue-100 text-sm font-extrabold text-blue-800">
                      {String.fromCharCode(65 + index)}
                    </span>
                    <span>{option}</span>
                  </button>
                );
              })}
            </div>

            {answered && (
              <div className={`detail-reveal mt-5 rounded-2xl p-5 ${correct ? "bg-emerald-50" : "bg-amber-50"}`}>
                <p className={`text-xl font-extrabold ${correct ? "text-emerald-800" : "text-amber-900"}`}>
                  {correct ? "✅" : "⚠️"} {correct ? t.scenarioCorrect : t.scenarioIncorrect}
                </p>
                <p className="mt-2 text-base leading-relaxed text-slate-700">{current.explanation}</p>
                <p className="mt-3 border-t border-slate-200/70 pt-3 text-base font-bold leading-relaxed text-blue-900">
                  {t.scenarioAdviceLabel}: {current.advice}
                </p>
                <button
                  type="button"
                  onClick={next}
                  className="mt-5 rounded-2xl bg-blue-700 px-5 py-3 text-base font-bold text-white shadow-sm transition hover:bg-blue-800 active:scale-95"
                >
                  {scenarioIndex === t.scenarios.length - 1 ? t.scenarioRestart : t.scenarioNext} →
                </button>
              </div>
            )}
          </div>
        </div>
      </Reveal>
    </section>
  );
}

  return (
    <section className="mx-auto max-w-5xl px-5 pt-12 sm:px-8" aria-labelledby="daily-tip-title">

/*  Страница: «Что делать, если…»                                        */

function WhatIfPage({ go, initialOpenId = null }) {
  const { lang, t } = useLang();
  const items = useMemo(() => getWhatIf(lang), [lang]);
  const [openId, setOpenId] = useState(initialOpenId);

  useEffect(() => {
    if (!initialOpenId) return undefined;
    const timer = window.setTimeout(() => {
      const el = document.getElementById("whatif-card-" + initialOpenId);
      if (el && el.scrollIntoView) {
        el.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }, 80);
    return () => window.clearTimeout(timer);
  }, [initialOpenId]);

  const toggle = (id) => {
    setOpenId((cur) => (cur === id ? null : id));
  };

  return (
    <div className="mx-auto max-w-5xl px-4 py-8 sm:px-8 sm:py-10">
      <button
        onClick={() => go("home")}
        className="mb-6 flex min-h-11 items-center gap-2 text-lg font-semibold text-blue-700 hover:text-blue-900"
      >
        <ArrowLeft className="h-5 w-5 shrink-0" />
        {t.homeAria}
      </button>
      <h1 className="text-2xl font-extrabold text-blue-900 sm:text-4xl">{t.whatIfTitle}</h1>
      <p className="mt-4 max-w-2xl text-lg leading-relaxed text-slate-600">{t.whatIfSubtitle}</p>

      <div className="mt-8 grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
        {items.map((item, i) => {
          const Icon = item.icon;
          const theme = DANGERS_CARD_THEMES[i % DANGERS_CARD_THEMES.length];
          const open = openId === item.id;
          const speechText = withPause(
            item.title,
            [
              `${t.whatIfFirst}. ${item.first}`,
              `${t.whatIfThen}. ${item.then}`,
              `${t.whatIfNever}. ${(item.never || []).join(". ")}`,
            ].join(" ")
          );
          return (
            <div
              key={item.id}
              id={"whatif-card-" + item.id}
              className={
                "flex min-w-0 flex-col rounded-3xl border-2 p-5 text-left shadow-sm transition hover:-translate-y-0.5 hover:shadow-md sm:p-6 " +
                (open ? "sm:col-span-2 lg:col-span-3 " : "") +
                theme.card
              }
            >
              <div className="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
                <button
                  type="button"
                  onClick={() => toggle(item.id)}
                  aria-expanded={open}
                  className="flex min-w-0 flex-1 items-start gap-3 text-left"
                >
                  <div
                    className={
                      "flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl sm:h-14 sm:w-14 " +
                      theme.badge
                    }
                  >
                    {Icon ? <Icon className="h-6 w-6 text-blue-800 sm:h-7 sm:w-7" /> : null}
                  </div>
                  <span className="min-w-0 flex-1">
                    <span className="block text-lg font-extrabold leading-snug text-blue-950 sm:text-xl">
                      {item.title}
                    </span>
                    <span className="mt-2 inline-flex items-center gap-1.5 text-base font-bold text-blue-700">
                      {open ? t.whatIfCardClose : t.whatIfCardCta}
                      <ChevronRight
                        className={
                          "h-5 w-5 shrink-0 transition " + (open ? "rotate-90" : "")
                        }
                      />
                    </span>
                  </span>
                </button>
                <SpeakButton id={`whatif-${item.id}`} text={speechText} />
              </div>

              {open ? (
                <div className="detail-reveal mt-5 grid gap-3 sm:grid-cols-3">
                  <div className="rounded-2xl border border-green-200 bg-green-50 p-4 sm:p-5">
                    <div className="flex items-center gap-2">
                      <CheckCircle2 className="h-5 w-5 shrink-0 text-green-600" />
                      <h2 className="text-base font-bold text-green-900 sm:text-lg">{t.whatIfFirst}</h2>
                    </div>
                    <p className="mt-2 text-base leading-relaxed text-slate-700">{item.first}</p>
                  </div>
                  <div className="rounded-2xl border border-sky-200 bg-sky-50 p-4 sm:p-5">
                    <div className="flex items-center gap-2">
                      <Info className="h-5 w-5 shrink-0 text-sky-600" />
                      <h2 className="text-base font-bold text-sky-900 sm:text-lg">{t.whatIfThen}</h2>
                    </div>
                    <p className="mt-2 text-base leading-relaxed text-slate-700">{item.then}</p>
                  </div>
                  <div className="rounded-2xl border border-red-200 bg-red-50 p-4 sm:p-5">
                    <div className="flex items-center gap-2">
                      <XCircle className="h-5 w-5 shrink-0 text-red-600" />
                      <h2 className="text-base font-bold text-red-900 sm:text-lg">{t.whatIfNever}</h2>
                    </div>
                    <ul className="mt-2 space-y-2">
                      {(item.never || []).map((line, ni) => (
                        <li key={ni} className="flex gap-2 text-base leading-relaxed text-slate-700">
                          <ShieldAlert className="mt-0.5 h-5 w-5 shrink-0 text-red-600" />
                          <span>{line}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              ) : null}
            </div>
          );
        })}
      </div>

      <EmergencyContactsBlock className="mt-10" />
    </div>
  );
}
